<title>ERP ConstruSalud en video</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<style>
/* Concepto: video 16:9 oscuro con cuadrícula, texto cinético, flujos con pulsos y un plano que se construye. Un solo look oscuro a propósito. */
:root{--bg:#0a0a09;--bg2:#161614;--surface:#0e0e0d;--ink:#ecebe5;--muted:#8d8b83;--line:#2b2a27;--accent:#f5a524;--accent-ink:#1b1200;--good:#5fd38d;--warn:#f5a524;--bad:#ff6b5e;--tg:#4aa3df;
--display:"Archivo","Arial Narrow",Arial,sans-serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font:800 clamp(24px,4vw,34px)/1.1 var(--display);margin:0}
header p{margin:6px 0 0;color:var(--muted);max-width:64ch}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.cv{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;padding:40px 56px;background-color:var(--surface);
 background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:40px 40px;
 font-size:21px;line-height:1.35;overflow:hidden;animation:drift 8s linear infinite}
@keyframes drift{to{background-position:40px 40px,40px 40px}}
.cv::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}
.sweep{position:absolute;top:0;left:0;width:3px;height:720px;background:var(--accent);box-shadow:0 0 26px 6px rgba(245,165,36,.55);z-index:6;pointer-events:none}
#start{position:absolute;inset:0;z-index:8;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(10,10,9,.6);color:var(--ink);font:700 clamp(16px,2.6vw,24px) var(--display)}
#start span{display:inline-flex;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);padding:14px 26px;border-radius:6px}
#start[hidden]{display:none!important}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent)}
.cap{display:none}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button.b{font:600 15px var(--sans);color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:9px 14px;cursor:pointer;min-height:40px}
button.b.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opts{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
label.t{display:inline-flex;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.opts select{font:500 14px var(--sans);color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px;max-width:230px;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:500 13px var(--mono);color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:8px 11px;cursor:pointer}
.chips button.cur{color:var(--ink);border-color:var(--accent)}
/* escenas */
.kick{font:500 15px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;gap:14px;align-items:center;position:relative;z-index:1}
h2{font:800 44px/1.04 var(--display);letter-spacing:-.015em;margin:10px 0 18px;max-width:1040px;position:relative;z-index:1}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}.wi{display:inline-block}
.tag{font:500 13px/1 var(--mono);border:1px solid var(--line);padding:5px 9px;border-radius:3px;color:var(--muted);text-transform:none;letter-spacing:.04em;background:var(--bg2)}
.card{background:rgba(22,22,20,.92);border:1px solid var(--line);border-radius:8px;padding:14px 16px;position:relative;z-index:1}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}.ok{color:var(--good)}.no{color:var(--bad)}.wn{color:var(--warn)}
.note{font-size:18px;color:var(--muted);line-height:1.35}.note b{color:var(--ink);font-weight:600}
.badge{font:500 14px/1 var(--mono);padding:6px 9px;border-radius:3px;background:var(--bg2);border:1px solid var(--line);text-align:center}
.bod{color:var(--ink)}.com{color:var(--warn)}.tra{color:var(--tg)}
.btn{display:inline-block;font:600 17px var(--sans);padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:var(--bg2)}
.btn.go{background:var(--good);color:#06180d;border-color:var(--good)}
.node{position:absolute;width:210px;padding:10px 12px;background:rgba(22,22,20,.95);border:1px solid var(--line);border-radius:8px;z-index:1}
.node h4{margin:0;font:700 19px/1.1 var(--display)}.node small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.node.top{border-color:var(--accent);border-width:2px}
svg.lines{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none}
svg.lines path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;opacity:.85}
svg.pl{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none;z-index:1;overflow:visible}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(245,165,36,.25),0 0 18px 4px rgba(245,165,36,.6);z-index:3}
.ph{position:absolute;top:150px;width:192px;height:530px;border:2px solid #3b3a36;border-radius:26px;background:#0d0d0c;overflow:hidden;display:flex;flex-direction:column;z-index:1}
.ph .hd{background:#1a1a18;padding:11px 12px;font:600 15px var(--sans);display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.ph .hd svg{color:var(--tg);flex:none}
.ph .ms{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;overflow:hidden}
.bx{display:none;background:#1c1c1a;border:1px solid var(--line);border-left:3px solid var(--tg);border-radius:8px;padding:8px 10px;font-size:14.5px;line-height:1.28}
.bx small{display:block;color:var(--muted);font:400 11.5px var(--mono);margin-top:3px}
.bx.alert{border-left-color:var(--warn)}.bx.bad{border-left-color:var(--bad)}
.toast{position:absolute;right:40px;top:96px;width:400px;z-index:5;background:#17212b;border:1px solid #2b3a4a;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.3;box-shadow:0 12px 32px rgba(0,0,0,.6)}
.toast .tt{display:flex;align-items:center;gap:8px;font:600 14px var(--sans);color:#ecebe5;margin-bottom:6px}.toast .tt i{margin-left:auto;font:400 12px var(--mono);color:#7d8e9e;font-style:normal}.toast .tb{color:#dfe6ee}.toast .tb b{color:#fff}
.bar{height:14px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0}
.big{font:800 72px/1 var(--display);letter-spacing:-.02em}
.nin{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-family:var(--mono)}
.nin input{width:100%;font:500 17px var(--mono);color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:7px 8px}
.logo{position:absolute;right:40px;top:22px;z-index:7;height:62px;display:flex;align-items:center}.logo img{height:62px;display:block}
.th{display:grid;grid-template-columns:270px repeat(8,1fr);align-items:center}
.th>div{padding:0 6px;text-align:center}.th>div:first-child{text-align:left;padding-left:14px}
.tr{border:1px solid transparent;border-radius:8px;height:50px;font-size:18px}
.tr.hl{border-color:var(--accent);background:rgba(245,165,36,.08)}
.cell{font:800 22px/1 var(--display)}
.cur2{position:absolute;z-index:9;width:26px;height:26px;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
@media (prefers-reduced-motion: reduce){.cv{animation:none}}
</style>
